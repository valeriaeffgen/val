<!-- Supabase → Authentication → Emails → Templates → "Magic Link"
     Assunto: O seu link de acesso à Val.
     Substitui o template antigo ("sem senha"): hoje o link mágico é a PONTE das
     contas antigas, que entram por ele e depois criam uma senha. Voz da Val. -->
<div style="background:#f6f1e7; padding:32px 16px; font-family:Arial,Helvetica,sans-serif; color:#243b33;">
  <div style="max-width:480px; margin:0 auto; background:#fbf8f1; border:1px solid #e6ddc9; border-radius:14px; padding:32px 28px;">
    <p style="margin:0 0 24px; font-family:Georgia,serif; font-style:italic; font-size:26px; color:#1d3a32;">Val<span style="color:#c9a24b;">.</span></p>
    <h1 style="margin:0 0 12px; font-family:Georgia,serif; font-style:italic; font-weight:normal; font-size:24px; color:#1d3a32;">É por aqui.</h1>
    <p style="margin:0 0 24px; font-size:16px; line-height:1.6; color:#3c4f47;">Toque no botão pra entrar na Val. Depois, se quiser, você cria uma senha pra das próximas vezes ser mais simples.</p>
    <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block; background:#1d3a32; color:#f6f1e7; text-decoration:none; padding:13px 30px; border-radius:999px; font-size:16px;">entrar na Val</a></p>
    <p style="margin:0; font-size:13px; line-height:1.6; color:#7a8a80;">Se o botão não abrir, cole este endereço no seu navegador:<br><a href="{{ .ConfirmationURL }}" style="color:#1d3a32;">{{ .ConfirmationURL }}</a></p>
  </div>
  <p style="max-width:480px; margin:16px auto 0; font-size:12px; color:#9aa79d; text-align:center;">Val, um lugar de retorno, no seu tempo.</p>
</div>
